# https://taskfile.dev
# Thin wrappers around the npm scripts in package.json. Run `task` to list them.
version: '3'

vars:
  REGION: alpstein

tasks:
  default:
    silent: true
    cmds:
      - task --list

  install:
    desc: Install npm dependencies (skipped when package-lock.json is unchanged)
    cmds:
      - npm install
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules/.package-lock.json

  dev:
    desc: Run the app locally with the Vite dev server (installs dependencies first)
    aliases: [run, start]
    deps: [install]
    cmds:
      - npm run dev -- {{.CLI_ARGS}}

  build:
    desc: Type-check and build the app into dist/ (set BASE=/<repo>/ for a subpath)
    deps: [install]
    cmds:
      - npm run build

  preview:
    desc: Serve the production build from dist/
    deps: [build]
    cmds:
      - npm run preview -- {{.CLI_ARGS}}

  test:
    desc: Run the unit tests
    deps: [install]
    cmds:
      - npm test -- {{.CLI_ARGS}}

  typecheck:
    desc: Type-check without emitting
    deps: [install]
    cmds:
      - npm run typecheck

  check:
    desc: Type-check, run the tests and validate every region bundle (what CI runs before building)
    cmds:
      - task: typecheck
      - task: test
      - task: regions:check

  release:
    desc: 'Bump the version, tag and push to deploy to GitHub Pages, e.g. `task release BUMP=minor` (default patch)'
    prompt: This bumps the version, tags it and pushes main to origin, which deploys the site. Continue?
    vars:
      BUMP: '{{.BUMP | default "patch"}}'
    preconditions:
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]'
        msg: Releases are cut from main
    cmds:
      - task: check
      - npm version {{.BUMP}} -m "Release v%s"
      - git push --follow-tags

  region:build:
    desc: 'Rebuild a region bundle from swisstopo data and refresh the region index (REGION={{.REGION}})'
    deps: [install]
    cmds:
      - npm run build:region -- {{.REGION}}

  region:check:
    desc: 'Validate a region bundle (REGION={{.REGION}})'
    deps: [install]
    cmds:
      - npm run check:region -- {{.REGION}}

  region:
    desc: 'Rebuild and validate a region bundle, e.g. `task region REGION=jungfrau`'
    cmds:
      - task: region:build
      - task: region:check

  regions:check:
    desc: Validate every region bundle in public/data/ and the region index
    deps: [install]
    cmds:
      - npm run check:region

  regions:scout:
    desc: 'Rank good region boxes from the cached national data, e.g. `task regions:scout -- --places zermatt` (see scripts/scout-regions.ts)'
    deps: [install]
    cmds:
      - npm run scout:regions -- {{.CLI_ARGS}}

  regions:index:
    desc: Rewrite public/data/regions.json from the built bundles (after deleting one or changing a defaultRoute)
    deps: [install]
    cmds:
      - npm run index:regions

  clean:
    desc: Remove build output
    cmds:
      - node -e "require('fs').rmSync('dist',{recursive:true,force:true})"

  clean:cache:
    desc: Remove the download cache in .cache/ (the next region build re-downloads ~300 MB)
    prompt: This deletes .cache/ and forces a full re-download. Continue?
    cmds:
      - node -e "require('fs').rmSync('.cache',{recursive:true,force:true})"
