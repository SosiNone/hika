<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HIKA · Alpstein</title>
    <meta name="description" content="Sci-fi HUD explorer for Swiss hiking routes, built on swisstopo open data." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307090a'/%3E%3Cpath d='M4 25 13 9l5 9 3-5 7 12z' fill='none' stroke='%23f2c230' stroke-width='2'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 26 13 8l5 9 3-5 8 14z" /></svg>
          <div>
            <div class="brand-title">HIKA</div>
            <div class="brand-sub" id="brand-sub">SWISS TRAIL CONSOLE</div>
          </div>
        </div>
        <div class="topbar-ticker" id="top-ticker"></div>
        <div class="legend" id="legend">
          <span><i class="sw sw-0"></i>WANDERWEG</span>
          <span><i class="sw sw-1"></i>BERGWANDERWEG</span>
          <span><i class="sw sw-2"></i>ALPINWANDERWEG</span>
        </div>
        <div class="clock">
          <div class="clock-date" id="clock-date">—</div>
          <div class="clock-time" id="clock-time">--:--:--</div>
          <div class="clock-sun" id="clock-sun">—</div>
        </div>
      </header>

      <main class="grid">
        <div class="col col-left">
          <section class="panel" id="p-replay"></section>
          <section class="panel grow" id="p-waypoints"></section>
          <section class="panel" id="p-class"></section>
          <section class="panel grow" id="p-routes"></section>
        </div>

        <div class="col col-center">
          <section class="panel stage" id="p-terrain">
            <canvas id="terrain"></canvas>
            <canvas id="terrain-hud"></canvas>
          </section>
          <div class="row-bottom">
            <section class="panel" id="p-profile"></section>
            <section class="panel" id="p-gradient"></section>
          </div>
        </div>

        <div class="col col-right">
          <section class="panel" id="p-locator"></section>
          <section class="panel" id="p-cumulative"></section>
          <section class="panel" id="p-terrainstats"></section>
          <section class="panel grow" id="p-log"></section>
        </div>
      </main>

      <footer class="footbar">
        <div class="foot-ticker" id="foot-ticker"></div>
        <div class="attribution" id="attribution">© swisstopo · SchweizMobil · geo.admin.ch</div>
      </footer>
      <div id="boot" class="boot">LOADING REGION…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
